<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d0d0d;
      color: #eaeaea;
      padding: 1.5rem;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: left;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 1.5rem;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background-color: #e5a93c;
      border-radius: 50%;
      box-shadow: 0 0 0 rgba(229, 169, 60, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(229, 169, 60, 0.4);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(229, 169, 60, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(229, 169, 60, 0);
      }
    }

    h1 {
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 1rem;
      color: #fff;
    }

    p {
      font-size: 0.95rem;
      color: #999;
      line-height: 1.6;
      margin-bottom: 2rem;
      font-weight: 300;
    }

    .footer {
      padding-top: 1.5rem;
      border-top: 1px solid #1f1f1f;
      font-size: 0.8rem;
      color: #555;
      display: flex;
      justify-content: space-between;
    }

    .footer a {
      color: #888;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="status-badge">
      <span class="pulse"></span>
      <span>Work in Progress</span>
    </div>

    <h1>We are crafting<br>something new.</h1>
    
    <p>
      Our website is currently undergoing planned maintenance and upgrades. 
      Please check back shortly.
    </p>

    <div class="footer">
      <span>&copy; 2026</span>
      <a href="mailto:contact@example.com">Get in touch &rarr;</a>
    </div>
  </main>

</body>
</html>
